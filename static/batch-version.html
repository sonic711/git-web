<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Batch Version Comparison</title>
  <meta name="theme-color" content="#f5f7f6">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="batch-version-page">
  <a class="skip-link" href="#mainContent">跳至主要內容</a>
  <div class="workspace-topbar"><span>工作空間 <span aria-hidden="true">/</span> <strong>批次版本比對</strong></span><a href="/#projects" class="text-link">返回專案</a></div>
  <header class="hero">
    <div>
      <span class="eyebrow">VERSION INTELLIGENCE</span>
      <h1>批次版本比對</h1>
      <p id="batchPageSubtitle">選擇相同同步規格，一次確認多個專案。</p>
    </div>
    <div class="inline-actions">
      <button type="button" class="secondary" id="refreshSpecsButton" data-icon="refresh">重新載入規格</button>
      <button type="button" id="startBatchButton" data-icon="compare" disabled>開始比對</button>
    </div>
  </header>

  <div id="toast" class="toast hidden" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="loadingOverlay" class="loading-overlay hidden" aria-live="polite" aria-busy="true">
    <div class="loading-card">
      <div class="spinner" aria-hidden="true"></div>
      <div id="loadingMessage">作業中…</div>
    </div>
  </div>

  <main class="layout" id="mainContent" tabindex="-1">
    <ol class="workflow-steps" aria-label="比對流程"><li><span>01</span> 選擇同步規格</li><li><span>02</span> 勾選比對專案</li><li><span>03</span> 檢視版本結果</li></ol>
    <section class="panel batch-version-controls">
      <label>同步規格
        <select id="batchSpecSelect"></select>
      </label>
      <label>結果狀態
        <select id="batchStatusFilter">
          <option value="all">全部狀態</option>
          <option value="IDENTICAL">完全一致</option>
          <option value="CONTENT_IDENTICAL">內容一致，歷程不同</option>
          <option value="DIFFERENT">版本不同</option>
          <option value="TARGET_MISSING">目標分支不存在</option>
          <option value="CHECK_FAILED">比對失敗</option>
        </select>
      </label>
      <label class="checkbox batch-mismatch-check">
        <input type="checkbox" id="batchMismatchOnly">
        只顯示不一致
      </label>
      <button type="button" class="secondary" id="rerunBatchButton" disabled>重新比對本批</button>
    </section>

    <section class="panel batch-project-selector">
      <div class="batch-project-selector-head">
        <div>
          <h2>選擇專案</h2>
          <p id="batchProjectSelectionSummary" class="panel-copy">尚未選擇同步規格</p>
        </div>
        <div class="inline-actions">
          <button type="button" class="secondary" id="selectAllBatchProjectsButton">全選</button>
          <button type="button" class="secondary" id="clearBatchProjectsButton">清除</button>
        </div>
      </div>
      <div id="batchProjectSelectionList" class="batch-project-selection-list"></div>
    </section>

    <section class="panel">
      <div class="batch-progress-head">
        <div>
          <h2 id="batchJobTitle">尚未開始比對</h2>
          <p id="batchJobMeta" class="panel-copy">請先選擇同步規格。</p>
        </div>
        <strong id="batchProgressText">0 / 0</strong>
      </div>
      <div class="batch-progress-track" id="batchProgress" role="progressbar" aria-label="批次比對進度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div id="batchProgressBar" class="batch-progress-bar"></div>
      </div>
    </section>

    <section class="panel batch-results-panel">
      <div id="batchResultSummary" class="panel-copy">尚無比對結果</div>
      <div class="batch-table-wrap">
        <table>
          <thead>
            <tr>
              <th>專案 / Rule</th>
              <th>來源</th>
              <th>目標</th>
              <th>判定</th>
              <th>時間</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="batchResultRows">
            <tr><td colspan="6" class="empty">尚無比對結果</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/ui.js"></script>
  <script src="/batch-version.js"></script>
</body>
</html>
